name: C7IA Offline Dependencies
on:
  push:
    paths:
      - ".github/workflows/c7ia-deps.yml"
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download offline dependencies
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p deps
          curl -fL --retry 4 --retry-delay 2 -o deps/python-3.13.16-embed-amd64.zip "https://www.python.org/ftp/python/3.13.16/python-3.13.16-embed-amd64.zip"
          curl -fL --retry 4 --retry-delay 2 -o deps/whisper-bin-x64.zip "https://github.com/ggml-org/whisper.cpp/releases/download/b5454/whisper-bin-x64.zip"
          curl -fL --retry 4 --retry-delay 2 -o deps/ggml-base.bin "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin?download=true"
          curl -fL --retry 4 --retry-delay 2 -o deps/whisper-cpp-darwin-arm64.zip "https://github.com/sjoerdteunisse/whisper.cpp/releases/download/v1.0.0/whisper-cpp-darwin-arm64.zip"
          curl -fL --retry 4 --retry-delay 2 -o deps/whisper-cpp-darwin-x64.zip "https://github.com/sjoerdteunisse/whisper.cpp/releases/download/v1.0.0/whisper-cpp-darwin-x64.zip"
          curl -fL --retry 4 --retry-delay 2 -o deps/cpython-3.11.17-aarch64-apple-darwin-install_only_stripped.tar.gz "https://github.com/astral-sh/python-build-standalone/releases/download/20261013/cpython-3.11.17%2B20261013-aarch64-apple-darwin-install_only_stripped.tar.gz"
          curl -fL --retry 4 --retry-delay 2 -o deps/cpython-3.11.17-x86_64-apple-darwin-install_only_stripped.tar.gz "https://github.com/astral-sh/python-build-standalone/releases/download/20261013/cpython-3.11.17%2B20261013-x86_64-apple-darwin-install_only_stripped.tar.gz"
          (cd deps && sha256sum * > SHA256SUMS.txt)
          ls -lh deps
      - name: Upload dependencies artifact
        uses: actions/upload-artifact@v4
        with:
          name: c7ia-offline-deps
          path: deps/
          compression-level: 0
          retention-days: 1
